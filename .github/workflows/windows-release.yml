name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - name: Install and verify source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build standalone Windows CLI
        run: pnpm release:cli:windows

      - name: Build NSIS and MSI installers
        run: pnpm release:desktop:windows

      - name: Collect and inspect release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/release/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/release/
          git archive `
            --format=tar.gz `
            --prefix=pdf2plt-0.1.0-source/ `
            --output=dist/release/pdf2plt-0.1.0-source.tar.gz `
            HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }

          & dist/release/pdf2plt-cli-windows-x64/pdf-pattern-svg.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI smoke check failed" }
          if (-not (Test-Path dist/release/pdf2plt-cli-windows-x64/mupdf-wasm.wasm)) {
            throw "Windows CLI bundle is missing mupdf-wasm.wasm"
          }

          $zipEntries = tar -tf dist/release/pdf2plt-cli-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI zip is invalid" }
          if (-not ($zipEntries -match "[/\\]LICENSE$")) { throw "Windows CLI zip is missing LICENSE" }
          if (-not ($zipEntries -match "[/\\]SOURCE_OFFER.md$")) {
            throw "Windows CLI zip is missing SOURCE_OFFER.md"
          }
          if ((Get-ChildItem dist/release/*.exe).Count -lt 1) { throw "NSIS installer is missing" }
          if ((Get-ChildItem dist/release/*.msi).Count -lt 1) { throw "MSI installer is missing" }
          if ((Get-Item dist/release/pdf2plt-0.1.0-source.tar.gz).Length -eq 0) {
            throw "Source archive is empty"
          }
          Get-ChildItem dist/release/*.exe, dist/release/*.msi, dist/release/*.zip |
            Get-FileHash -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2plt-windows-x64
          path: |
            dist/release/*.exe
            dist/release/*.msi
            dist/release/*.zip
            dist/release/pdf2plt-0.1.0-source.tar.gz
          if-no-files-found: error
