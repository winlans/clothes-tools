name: Windows release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Verify release version
        id: version
        shell: bash
        run: node --input-type=module -e 'import { releaseVersion } from "./scripts/release-utils.mjs"; console.log("value=" + releaseVersion())' >> "$GITHUB_OUTPUT"

      - name: Install and verify source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build standalone Windows CLI
        run: pnpm release:cli:windows

      - name: Build NSIS and MSI installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BAIDU_TONGJI_SITE_ID: ${{ vars.VITE_BAIDU_TONGJI_SITE_ID }}
        run: node scripts/build-desktop-release.mjs windows --signed

      - name: Collect and inspect release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe* dist/release/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi* dist/release/
          git archive `
            --format=tar.gz `
            --prefix=pdf2plt-${env:RELEASE_VERSION}-source/ `
            --output=dist/release/pdf2plt-${env:RELEASE_VERSION}-source.tar.gz `
            HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }

          pnpm --filter @pdf2plt/cli verify:release windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Windows standalone CLI check failed" }

          $zipEntries = tar -tf dist/release/pdf2plt-cli-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI zip is invalid" }
          if (-not ($zipEntries -match "[/\\]LICENSE$")) { throw "Windows CLI zip is missing LICENSE" }
          if (-not ($zipEntries -match "[/\\]SOURCE_OFFER.md$")) {
            throw "Windows CLI zip is missing SOURCE_OFFER.md"
          }
          if ((Get-ChildItem dist/release/*.exe).Count -lt 1) { throw "NSIS installer is missing" }
          if ((Get-ChildItem dist/release/*.msi).Count -lt 1) { throw "MSI installer is missing" }
          if ((Get-Item "dist/release/pdf2plt-${env:RELEASE_VERSION}-source.tar.gz").Length -eq 0) {
            throw "Source archive is empty"
          }
          Get-ChildItem dist/release/*.exe, dist/release/*.msi, dist/release/*.zip |
            Get-FileHash -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2plt-windows-x64
          path: |
            dist/release/*.exe
            dist/release/*.msi
            dist/release/*.zip
            dist/release/*-source.tar.gz
            dist/release/*.sig
          if-no-files-found: error
