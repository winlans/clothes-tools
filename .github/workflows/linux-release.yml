name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install and verify source
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build standalone CLI
        run: pnpm release:cli

      - name: Build AppImage and deb
        run: pnpm tauri build

      - name: Collect and inspect release artifacts
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/release/
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist/release/
          git archive \
            --format=tar.gz \
            --prefix=pdf2plt-0.1.0-source/ \
            --output=dist/release/pdf2plt-0.1.0-source.tar.gz \
            HEAD
          dist/release/pdf2plt-cli-linux-x64/pdf-pattern-svg --help
          test -s dist/release/pdf2plt-cli-linux-x64/mupdf-wasm.wasm
          tar -tzf dist/release/pdf2plt-cli-linux-x64.tar.gz | grep -q '/LICENSE$'
          tar -tzf dist/release/pdf2plt-cli-linux-x64.tar.gz | grep -q '/SOURCE_OFFER.md$'
          test -s dist/release/pdf2plt-0.1.0-source.tar.gz
          dpkg-deb --info dist/release/*.deb
          file dist/release/*.AppImage dist/release/pdf2plt-cli-linux-x64/pdf-pattern-svg

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2plt-linux-x64
          path: dist/release/*
          if-no-files-found: error
