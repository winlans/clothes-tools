[package]
name = "pdf2plt"
version = "0.1.0"
description = "Visual PDF sewing-pattern layout tool"
authors = ["pdf2plt contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "pdf2plt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
